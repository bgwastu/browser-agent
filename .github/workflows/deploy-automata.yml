# Every push to main pins automata's browser-agent app to the new commit; automata's own
# Coolify webhook then rebuilds and redeploys it.
name: Deploy to automata

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-automata
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@v2
      - uses: actions/checkout@v4
        with:
          repository: bgwastu/automata
          token: ${{ secrets.AUTOMATA_TOKEN }}
          path: automata
      - name: Pin and push
        working-directory: automata/apps/browser-agent
        env:
          SHA: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          sed -i -E "s|(\"browser-agent\": \"github:bgwastu/browser-agent#)[0-9a-f]+\"|\1${SHA}\"|" package.json
          grep -q "$SHA" package.json
          bun install
          git config user.name "browser-agent deploy"
          git config user.email "actions@users.noreply.github.com"
          git add package.json bun.lock
          if git diff --cached --quiet; then echo "Already pinned"; exit 0; fi
          git commit -m "browser-agent: bump to ${SHA:0:7}" -m "$MESSAGE"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
